<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintCutConjure — Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Quicksand', sans-serif; margin: 0; background: linear-gradient(160deg, #fdf3f9, #fff9f4); color: #43303e; min-height: 100vh; }
  main { max-width: 620px; margin: 0 auto; padding: 64px 22px; text-align: center; }
  h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 3em; color: #5b2a6e; margin: 0 0 6px; }
  .card { background: #fff; border: 2px solid #f3d9ea; border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 24px rgba(91,42,110,.12); margin-top: 18px; }
  .btn { display: inline-block; background: #ff7a1a; color: #fff; text-decoration: none; padding: 14px 34px; border-radius: 40px; font-size: 1.12em; font-weight: 700; margin-top: 18px; box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  .btn:hover { background: #f96a05; }
  #items { margin: 14px auto 0; max-width: 440px; text-align: left; }
  #items ul { margin: 6px 0; }
  .sparkle { color: #e5639a; }
</style>
</head>
<body>
<main>
  <h1>PrintCutConjure</h1>
  <div class="card">
    <p><span class="sparkle">✦</span> <strong>Almost yours!</strong> <span class="sparkle">✦</span></p>
    <p id="msg">Taking you to your item on Etsy, where you can check out securely…</p>
    <div id="items"></div>
    <a class="btn" id="go" href="https://printcutconjure.etsy.com">Continue to the PrintCutConjure Etsy Shop</a>
  </div>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var products = params.get('products') || '';
  var coupon = params.get('coupon') || '';
  var entries = products.split(',').map(function (s) { return s.trim(); }).filter(Boolean).map(function (s) {
    var parts = s.split(':');
    return { id: parts[0], qty: parts[1] || '1' };
  });
  var listEl = document.getElementById('items');
  var goEl = document.getElementById('go');
  var msgEl = document.getElementById('msg');
  function isEtsyId(id) { return /^[0-9]{6,}$/.test(id); }
  if (entries.length) {
    var html = '<p><strong>Your item(s):</strong></p><ul>';
    entries.forEach(function (e) { html += '<li>Product ' + e.id + ' &times; ' + e.qty + '</li>'; });
    if (coupon) { html += '</ul><p>Coupon: ' + coupon + ' — enter it at Etsy checkout.</p>'; } else { html += '</ul>'; }
    listEl.innerHTML = html;
  }
  var target = 'https://printcutconjure.etsy.com';
  if (entries.length === 1 && isEtsyId(entries[0].id)) {
    target = 'https://printcutconjure.etsy.com/listing/' + entries[0].id;
  }
  goEl.href = target;
  if (entries.length === 1 && isEtsyId(entries[0].id)) {
    setTimeout(function () { window.location.href = target; }, 1500);
  } else if (entries.length > 0) {
    msgEl.textContent = 'Your items are waiting in the PrintCutConjure Etsy shop — tap below to view and check out securely on Etsy.';
  } else {
    msgEl.textContent = 'Welcome! All PrintCutConjure printables are sold through our Etsy shop — tap below to browse and check out securely.';
  }
})();
</script>
</body>
</html>
